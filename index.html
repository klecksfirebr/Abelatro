<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="abel-sigma.png" type="image/x-icon">
    <script src="cartas.js" defer></script>

        </div>
    </div>
    <div id="abelDeTras"></div>
    <main>
        <div id="jokers">

        </div>
        <div id="jogo">

        </div>
        <div id="cartas">

        </div>

            <button id="jogar" class="botoes">Jogar Mao</button>
            <button id="descartar" class="botoes" onclick="descarte()">Descartar</button>
        </div>

</html>
